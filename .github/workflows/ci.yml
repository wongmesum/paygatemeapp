name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
          cache-dependency-path: |
            paygateme/go.sum
            paygatemeapp/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: paygatemeapp/web/package-lock.json
      - name: Build frontend
        working-directory: paygatemeapp/web
        run: npm ci && npm run build
      - name: Test SDK
        run: go test ./paygateme/...
      - name: Test gateway application
        run: go test ./paygatemeapp/...
      - name: Build gateway binary
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/paygatemeapp ./paygatemeapp/cmd/server
      - name: Build container
        run: docker build -t paygatemeapp:ci .
